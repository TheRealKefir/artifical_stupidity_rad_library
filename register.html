<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #333333;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        /* Карточка логина */
        .login-card {
            background-color: #4d4d4d;
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            width: 100%;
            max-width: 420px;
            padding: 2rem 2rem 2.2rem;
            transition: transform 0.2s ease;
            border: 1px solid rgba(255,255,255,0.6);
        }


        /* Заголовок */
        .login-header {
            color: #313631;
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            background-color: #1e2b3c;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .login-header p {
            color: #313631;
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Поля ввода */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #1f2a44;
            font-size: 0.85rem;
            letter-spacing: 0.3px;
        }

        .input-field {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 1.2rem;
            font-size: 1rem;
            transition: all 0.2s;
            background-color: #807a7a;
            outline: none;
            font-family: inherit;
        }

        .input-field:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        }


        .forgot-link {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Кнопка входа */
        .login-btn {
            width: 100%;
            background: linear-gradient(95deg, #1e3c72, #2b4f8c);
            border: none;
            padding: 0.9rem;
            border-radius: 2rem;
            color: white;
            margin-bottom: 1.5rem;
        }

        .login-btn:hover {
            background: linear-gradient(95deg, #143256, #1f3f6e);
            transform: translateY(-2px);
            box-shadow: 0 10px 18px rgba(0,0,0,0.12);
        }




    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Регистрация</h1>
        </div>
        <div class="input-group">
            <label>Логин</label>
            <input type="text" id="username" class="input-field" placeholder="введите имя пользователя" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Почта</label>
            <input type="text" id="email" class="input-field" placeholder="введите почту">
        </div>

        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="password1" class="input-field" placeholder="введите пароль" autocomplete="off">
        </div>

        <div class="input-group">
            <label>Повторить пароль</label>
            <input type="password" id="password2" class="input-field" placeholder="введите снова пароль">
        </div>

        <!-- ДВЕ КНОПКИ В ОДНОЙ СТРОКЕ -->
        <div style="display: flex; gap: 12px; margin-top: 20px;">
            <button type="submit" style="flex: 1; padding: 12px; background: #808080; color: white; border: none; border-radius: 8px; cursor: pointer;">Войти</button>
        </div>

    </div>
</body>
</html>
