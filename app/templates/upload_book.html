{% extends "base.html" %}

{% block content %}
<div class="upload-container">

    <h2>Загрузка книги</h2>

    <form method="POST" enctype="multipart/form-data">
        {{ form.hidden_tag() }}

        <div>
            {{ form.book.label }}
            {{ form.book() }}
        </div>

        <button type="submit" class="btn">
            Загрузить
        </button>
    </form>

</div>
{% endblock %}
